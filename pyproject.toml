[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", "venv", ".venv", "benchmarks", "reports", "uploads"]
markers = [
    "unit: Pure logic tests (no external deps)",
    "integration: Tests needing embedding/LLM/workspace",
    "e2e: End-to-end tests (local only)",
]
